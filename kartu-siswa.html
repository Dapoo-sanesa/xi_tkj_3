	<link rel="stylesheet" href="style.css" />
	<style>
		.identity-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
		.identity-card { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: rgba(10, 10, 13, .9); text-align: center; }
		.identity-card img { width: 112px; height: 112px; padding: 8px; margin: 12px auto; display: block; background: white; border-radius: 8px; }
		.identity-card strong { display: block; font: 600 14px "Space Grotesk", sans-serif; }
		.identity-card small { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; }
		@media (max-width: 700px) { .identity-grid { grid-template-columns: repeat(2, 1fr); } }
		@media (max-width: 390px) { .identity-grid { grid-template-columns: 1fr; } }
	</style>
</head>

		<main>
			<header class="topbar"><div><div class="eyebrow">Identitas digital • XI TKJ 3</div><h1>Kartu siswa</h1><p class="subtitle">Setiap kartu memiliki QR Code unik untuk absensi otomatis.</p></div><div class="date">TOTAL KARTU<strong>34 siswa</strong></div></header>
			<section class="identity-grid" id="identityGrid"></section>
		</main>
	</div>
	<script src="script.js"></script>
	<script>
		const identityGrid = document.querySelector("#identityGrid");
		identityGrid.innerHTML = students.map((name, index) => {
			const code = `XI-TKJ3-${String(index + 1).padStart(2, "0")}`;
			const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(code)}`;
			return `<article class="identity-card"><div class="eyebrow">Absen ${String(index + 1).padStart(2, "0")}</div><img src="${qrUrl}" alt="QR Code ${name}" /><strong>${name}</strong><small>${code}</small></article>`;
		}).join("");
	</script>
